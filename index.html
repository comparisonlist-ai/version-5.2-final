<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="theme-color"
        content="#2563eb">

    <meta
        name="description"
        content="Students Homework AI - CBSE Class 6 to 10 Homework Assistant">

    <title>
        Students Homework AI
        | Version 5.2
    </title>

    <!-- Google Font -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Styles -->

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>

    <div id="app">

        <!-- ==========================================
             HEADER
        =========================================== -->

        <header
            class="app-header">

            <h1>
                Students Homework AI
            </h1>

            <p>
                Made for CBSE Students
                (Class 6 – 10)
            </p>

        </header>

        <!-- ==========================================
             WELCOME SCREEN
        =========================================== -->

        <section
            id="welcomeScreen"
            class="screen active">

            <div class="card">

                <h2>
                    Homework Help
                    in Minutes
                </h2>

                <p>

                    Scan or type your
                    homework question and
                    get step-by-step answers
                    according to the latest
                    NCERT syllabus.

                </p>

                <button
                    id="trialButton"
                    onclick="showRegistration()">

                    Start Your
                    7-Day Free Trial

                </button>

                <button
                    class="secondary-btn"
                    onclick="showLogin()">

                    Student Login

                </button>

            </div>

        </section>

        <!-- ==========================================
             REGISTRATION SCREEN
        =========================================== -->

        <section
            id="registrationScreen"
            class="screen">

            <div class="card">

                <h2>

                    Student Registration

                </h2>

                <form
                    id="registrationForm"
                    onsubmit="registerStudent(); return false;">

                    <label>

                        Student Name

                    </label>

                    <input
                        type="text"
                        id="studentName"
                        placeholder="Enter student's name"
                        required>

                    <label>

                        Class

                    </label>

                    <select
                        id="studentClass"
                        required>

                        <option value="">
                            Select Class
                        </option>

                        <option value="Class 6">
                            Class 6
                        </option>

                        <option value="Class 7">
                            Class 7
                        </option>

                        <option value="Class 8">
                            Class 8
                        </option>

                        <option value="Class 9">
                            Class 9
                        </option>

                        <option value="Class 10">
                            Class 10
                        </option>
